# ===============================
# Kindred Newsletter API — Detekt Configuration
# ===============================

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: true

output-reports:
  active: true
  exclude: []

# ===============================
# Style Rules
# ===============================

style:
  MagicNumber:
    active: true
    ignoreNumbers: [-1, 0, 1, 2]
    ignoreHashCodeFunction: true
    ignoreAnnotation: true
    ignoreNamedArgument: true

  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeCommentLines: false

  WildcardImport:
    active: true
    excludeImports:
      - 'kotlinx.coroutines.*'
      - 'io.ktor.server.*'

  UnusedImports:
    active: true

  UnusedPrivateMember:
    active: true

  OptionalUnit:
    active: true

  OptionalSemicolon:
    active: true

  OptionalBraces:
    active: false

  MagicConst:
    active: true

# ===============================
# Formatting Rules
# (via ktlint integration)
# ===============================

formatting:
  active: true
  android: false
  maxLineLength:
    active: true
    maxLineLength: 140
  indentSize:
    active: true
    indent: 4

# ===============================
# Naming Rules
# ===============================

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
    functionPattern: '^[a-z][A-Za-z0-9]*$'

  VariableNaming:
    active: true
    variablePattern: '^[a-z][A-Za-z0-9]*$'

  ObjectPropertyNaming:
    active: true

  PackageNaming:
    active: true
    packagePattern: '^[a-z]+(\.[a-z][A-Za-z0-9]*)*$'

# ===============================
# Complexity Rules
# ===============================

complexity:
  LongMethod:
    active: true
    threshold: 40

  LongParameterList:
    active: true
    threshold: 8

  TooManyFunctions:
    active: true
    thresholdInClass: 30
    thresholdInInterface: 20

  NestedBlockDepth:
    active: true
    threshold: 4

  CyclomaticComplexity:
    active: true
    threshold: 15

  CognitiveComplexity:
    active: true
    threshold: 20

# ===============================
# Documentation Rules
# ===============================

comments:
  UndocumentedPublicFunction:
    active: false  # OSS-friendly — enable later if needed

  UndocumentedPublicClass:
    active: false

  CommentOverPrivateFunction:
    active: false

# ===============================
# Potential Bug Rules
# ===============================

potential-bugs:
  DuplicateCaseInWhenExpression:
    active: true

  EqualsNullCall:
    active: true

  MissingWhenCase:
    active: true

  NullableToStringCall:
    active: true

  UnsafeCallOnNullableType:
    active: true

  UnsafeCast:
    active: true

  IteratorNotThrowingNoSuchElementException:
    active: true

# ===============================
# Coroutines & Concurrency
# ===============================

coroutines:
  GlobalCoroutineUsage:
    active: true

  RedundantSuspendModifier:
    active: true

  InjectDispatcher:
    active: false   # We will use Koin for dispatchers, do not enforce yet.

# ===============================
# Empty Blocks
# ===============================

empty-blocks:
  EmptyFunctionBlock:
    active: true
  EmptyClassBlock:
    active: true
  EmptyCatchBlock:
    active: false  # sometimes intentional
  EmptyFinallyBlock:
    active: true
  EmptyDefaultConstructor:
    active: false

# ===============================
# Code Smells
# ===============================

code-smell:
  DataClassShouldBeImmutable:
    active: true

  UseDataClass:
    active: true

  LateinitUsage:
    active: false   # Backend often needs DI-lateinit; do not enforce.

  ComplexCondition:
    active: true

  FeatureEnvy:
    active: false   # Too noisy, not helpful for backend.

  GodClass:
    active: true
    threshold: 1500

# ===============================
# Exceptions
# ===============================

exceptions:
  ThrowingExceptionInMain:
    active: false

  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - "CancellationException"

  InstanceOfCheckForException:
    active: true

