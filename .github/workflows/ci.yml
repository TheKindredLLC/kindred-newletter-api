name: CI

on:
  push:
    branches: [ main, dev, feature/**, bugfix/** ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper (retry)
        run: |
          for i in {1..3}; do
            echo "Attempt $i: Validating Gradle wrapper..."
            ./gradlew wrapper --verify && break
            echo "Validation failed. Retrying in 5 seconds..."
            sleep 5
          done          

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

      - name: Run detekt
        run: ./gradlew detekt --no-daemon --stacktrace

      - name: Run spotless
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
