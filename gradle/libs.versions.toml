[versions]
detekt = "2.0.0-alpha.1"
flyway = "10.20.1"
khealth = "3.0.2"
koin = "4.1.2-Beta1"
kotlin = "2.2.21"
ktor = "3.3.2"
lint = "14.0.1"
logback = "1.5.21"
markdown = "0.27.0"
micro = "1.16.0"
open = "2.22.0-alpha"
rate-limiting = "2.2.1"
serial = "1.9.0"
smtpMail = "2.0.2"
spotless = "8.1.0"

[libraries]

# ==============
# Code Standards
# ==============

# ==============
# Dependency Injection
# ==============
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-logger = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }

# ==============
# Email
# ==============
smtp-email = { module = "com.sun.mail:jakarta.mail", version.ref = "smtpMail" }

# ==============
# HTTP / Ktor Server
# ==============
ktor-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-call-id = { module = "io.ktor:ktor-server-call-id", version.ref = "ktor" }
ktor-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor" }
ktor-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-default-headers = { module = "io.ktor:ktor-server-default-headers", version.ref = "ktor" }
ktor-forwarded-header = { module = "io.ktor:ktor-server-forwarded-header", version.ref = "ktor" }
ktor-host-common = { module = "io.ktor:ktor-server-host-common", version.ref = "ktor" }
ktor-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer", version.ref = "ktor" }
ktor-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }

# ==============
# Logging
# ==============
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# ==============
# Markdown
# ==============
commonmark-autolink = { module = "org.commonmark:commonmark-ext-autolink", version.ref = "markdown" }
commonmark-core = { module = "org.commonmark:commonmark", version.ref = "markdown" }
commonmark-gfm = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "markdown" }

# ==============
# Metrics / Observability
# ==============
khealth = { module = "dev.hayden:khealth", version.ref = "khealth" }
micrometer = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micro" }
opentelemetry = { module = "io.opentelemetry.instrumentation:opentelemetry-ktor-3.0", version.ref = "open"}

# ==============
# Rate Limiting
# ==============
rate-limiting = { module = "io.github.flaxoos:ktor-server-rate-limiting", version.ref = "rate-limiting" }

# ==============
# Serialization
# ==============
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serial" }


# ------------------------
# Testing
# ------------------------
ktor-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

# ------------------------
# Plugins (alphabetical)
# ------------------------
[plugins]
detekt = { id = "dev.detekt", version.ref = "detekt" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "lint" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
